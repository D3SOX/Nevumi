AutoName: Nevumi
Summary: Local music and Navidrome in one library
Description: |-
  Play local music and your Navidrome library, online or offline.
  Download songs and playlists, organize your queue, and edit music files.
  Choose system or artwork colors, including an AMOLED black theme.
  Pair with Nevumi on Linux to synchronize playlists and listening history.

