[versions]
kotlin = "2.4.21"
compose = "1.12.1"
material3 = "1.9.0"
agp = "9.4.1"
coroutines = "1.11.0"
serialization = "1.11.0"
ktor = "3.6.0"
room = "2.8.5"
ksp = "2.3.12"
media3 = "1.11.1"
sqlite = "2.7.1"
okio = "3.18.2"
jna = "5.19.1"
jaudiotagger = "3.0.1"
activity = "1.13.0"
androidTest = "1.7.0"
androidJunit = "1.3.0"
androidOrchestrator = "1.6.1"
materialKolor = "5.0.1"
dbus = "5.2.2"
sshj = "0.41.2"
bouncycastle = "1.86"
camerax = "1.6.2"
zxing = "3.5.4"

[libraries]
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
material-kolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
dbus-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus" }
dbus-unix = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbus" }
sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }
bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
jaudiotagger = { module = "net.jthink:jaudiotagger", version.ref = "jaudiotagger" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
android-test-runner = { module = "androidx.test:runner", version.ref = "androidTest" }
android-test-core = { module = "androidx.test:core", version.ref = "androidTest" }
android-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidJunit" }
android-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "androidOrchestrator" }
startup-runtime = { module = "androidx.startup:startup-runtime", version = "1.2.0" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-multiplatform = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
