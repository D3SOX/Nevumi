name: Development builds
on:
  push:
    branches: [master]
    paths:
      - LICENSE
      - androidApp/**
      - desktopApp/**
      - shared/**
      - native/**
      - gradle/**
      - '*.gradle.kts'
      - gradle.properties
      - gradlew
      - gradlew.bat
      - scripts/**
      - '!scripts/package-website.py'
      - packaging/**
      - '!packaging/screenshots/**'
      - '!packaging/fdroid-qr*.png'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-builds
  cancel-in-progress: false
jobs:
  acceptance:
    uses: ./.github/workflows/tests.yml
  android:
    needs: acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/tailscale/go.mod
          cache-dependency-path: native/tailscale/go.sum
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - run: bash scripts/sdkmanager-retry.sh 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: ./gradlew :androidApp:lintDevelopment :androidApp:assembleDevelopment --console=plain
      - run: mkdir -p .test-environment/development && cp androidApp/build/outputs/apk/development/androidApp-development.apk .test-environment/development/nevumi-dev.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-android
          path: .test-environment/development/*.apk
          if-no-files-found: error
  linux:
    needs: acceptance
    runs-on: ubuntu-24.04
    env:
      NEVUMI_NATIVE_BUILD_TYPE: RelWithDebInfo
      LD_LIBRARY_PATH: ${{ github.workspace }}/.test-environment/mpv-runtime/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/tailscale/go.mod
          cache-dependency-path: native/tailscale/go.sum
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg mpv libmpv-dev libsecret-tools xvfb x11-utils dbus cmake ninja-build libsdl2-dev libgl1-mesa-dev pulseaudio-utils meson pkg-config libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libplacebo-dev libass-dev libpulse-dev libasound2-dev
      - run: python3 scripts/build_mpv.py --prefix .test-environment/mpv-runtime
      - run: ./gradlew --configure-on-demand :desktopApp:createDistributable --console=plain
      - run: python3 scripts/test-linux-player.py
      - name: Create the Arch development package
        run: |
          version=$(sed -n 's/^appVersion=//p' gradle.properties)
          docker compose -f scripts/compose.yaml run --rm -T -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e "NEVUMI_BUILD_UID=$(id -u)" -e "NEVUMI_VERSION=$version" -e GITHUB_RUN_NUMBER -e GITHUB_RUN_ID \
            arch \
            bash -euc 'pacman -Syu --noconfirm base-devel python
              useradd --uid "$NEVUMI_BUILD_UID" --create-home builder
              runuser -u builder -- python3 scripts/package-linux.py --image desktopApp/build/compose/binaries/main/app/nevumi \
                --output .test-environment/development --version "$NEVUMI_VERSION" --pkgrel "0.$GITHUB_RUN_NUMBER" --release-tag "development-$GITHUB_RUN_ID"'
      - name: Create the AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^appVersion=//p' gradle.properties)
          python3 scripts/package-appimage.py --image desktopApp/build/compose/binaries/main/app/nevumi \
            --output .test-environment/development --version "$version-dev-${GITHUB_SHA:0:12}" \
            --mpv-library .test-environment/mpv-runtime/lib/libmpv.so.2
      - name: Check the AppImage without FUSE
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: NEVUMI_TEST_APP="$(find "$GITHUB_WORKSPACE/.test-environment/development" -name '*.AppImage' -print -quit)" python3 scripts/test-linux-player.py LinuxPlayerTest.test_packaged_player_registers_desktop_media_controls
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-linux
          path: |
            .test-environment/development/*.AppImage
            .test-environment/development/*.pkg.tar.zst
          if-no-files-found: error
  publish:
    needs: [android, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: development-*
          merge-multiple: true
          path: development
      - name: Publish the development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd development
          printf 'Development build from commit %s. Android installs as Nevumi dev. Linux packages replace Nevumi.\n' "$GITHUB_SHA" > notes.txt
          tag="development-$GITHUB_RUN_ID"
          # Release creation needs an existing ref when newer commits change workflows.
          git push origin "$GITHUB_SHA:refs/tags/$tag"
          assets=(./*.apk ./*.pkg.tar.zst ./*.AppImage)
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == false ]]; then
              # A completed rerun must still match the published artifacts.
              for asset in "${assets[@]}"; do gh release verify-asset "$tag" "$asset"; done
              exit 0
            fi
          else
            gh release create "$tag" --verify-tag --draft --prerelease \
              --title "Nevumi development ${GITHUB_SHA:0:12}" --notes-file notes.txt
          fi
          gh release upload "$tag" --clobber "${assets[@]}"
          gh release edit "$tag" --draft=false
