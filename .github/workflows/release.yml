name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  acceptance:
    uses: ./.github/workflows/tests.yml
  android:
    needs: acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/tailscale/go.mod
          cache-dependency-path: native/tailscale/go.sum
      - run: python3 scripts/check-release-version.py "$GITHUB_REF_NAME"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - run: bash scripts/sdkmanager-retry.sh 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: ./gradlew :androidApp:lintRelease :androidApp:assembleRelease --console=plain
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pil
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator action downloads these without retrying, so a corrupt archive would fail the release.
      - run: >-
          bash scripts/sdkmanager-retry.sh emulator platform-tools 'build-tools;37.0.0' 'platforms;android-36'
          'system-images;android-36;google_apis_ps16k;x86_64'
      - name: Check the optimized APK and MilkDrop
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis_ps16k
          arch: x86_64
          disable-linux-hw-accel: false
          profile: pixel_2
          avd-name: nevumi_release_ci
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none
          script: NEVUMI_TEST_SERIAL=emulator-5554 /usr/bin/python3 scripts/test-android-package.py
      - name: Sign the Android release
        env:
          NEVUMI_ANDROID_KEYSTORE_BASE64: ${{ secrets.MANIDA_ANDROID_KEYSTORE_BASE64 }}
          NEVUMI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MANIDA_ANDROID_KEYSTORE_PASSWORD }}
          NEVUMI_ANDROID_KEY_PASSWORD: ${{ secrets.MANIDA_ANDROID_KEY_PASSWORD }}
          NEVUMI_ANDROID_KEY_ALIAS: ${{ vars.MANIDA_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          signing_directory=$(mktemp -d)
          trap 'rm -rf -- "$signing_directory"' EXIT
          printf '%s' "$NEVUMI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_directory/nevumi.jks"
          chmod 600 "$signing_directory/nevumi.jks"
          mkdir -p .test-environment/android-release
          python3 scripts/sign-android.py --input androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk \
            --output ".test-environment/android-release/nevumi-${GITHUB_REF_NAME#v}.apk" \
            --keystore "$signing_directory/nevumi.jks" --alias "$NEVUMI_ANDROID_KEY_ALIAS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: .test-environment/android-release/*.apk
          if-no-files-found: error
  linux:
    needs: acceptance
    runs-on: ubuntu-24.04
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/.test-environment/mpv-runtime/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/tailscale/go.mod
          cache-dependency-path: native/tailscale/go.sum
      - run: python3 scripts/check-release-version.py "$GITHUB_REF_NAME"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg mpv libmpv-dev libsecret-tools xvfb dbus cmake ninja-build libsdl2-dev libgl1-mesa-dev pulseaudio-utils meson pkg-config libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libplacebo-dev libass-dev libpulse-dev libasound2-dev
      - run: python3 scripts/build_mpv.py --prefix .test-environment/mpv-runtime
      - run: ./gradlew --configure-on-demand :desktopApp:createDistributable --console=plain
      - run: python3 scripts/test-linux-player.py
      - name: Create and sign the Arch repository
        env:
          NEVUMI_ARCH_SIGNING_KEY: ${{ secrets.MANIDA_ARCH_SIGNING_KEY }}
          NEVUMI_ARCH_SIGNING_PASSPHRASE: ${{ secrets.MANIDA_ARCH_SIGNING_PASSPHRASE }}
          NEVUMI_ARCH_SIGNING_FINGERPRINT: ${{ vars.MANIDA_ARCH_SIGNING_FINGERPRINT }}
        run: |
          docker compose -f scripts/compose.yaml run --rm -T -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e GITHUB_ACTIONS -e GITHUB_REF_NAME -e NEVUMI_ARCH_SIGNING_KEY \
            -e NEVUMI_ARCH_SIGNING_PASSPHRASE -e NEVUMI_ARCH_SIGNING_FINGERPRINT \
            -e "NEVUMI_BUILD_UID=$(id -u)" \
            arch \
            bash -euc 'pacman -Syu --noconfirm base-devel gnupg python
              useradd --uid "$NEVUMI_BUILD_UID" --create-home builder
              runuser -u builder -- bash scripts/ci-package-linux.sh'
      - name: Create the AppImage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/package-appimage.py --image desktopApp/build/compose/binaries/main/app/nevumi --output .test-environment/release --version "${GITHUB_REF_NAME#v}" --mpv-library .test-environment/mpv-runtime/lib/libmpv.so.2
      - name: Check the AppImage without FUSE
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: NEVUMI_TEST_APP="$GITHUB_WORKSPACE/.test-environment/release/nevumi-${GITHUB_REF_NAME#v}-x86_64.AppImage" python3 scripts/test-linux-player.py LinuxPlayerTest.test_packaged_player_registers_desktop_media_controls
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            .test-environment/release/*.AppImage
            .test-environment/release/*.pkg.tar.zst
            .test-environment/release/*.pkg.tar.zst.sig
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-repository
          path: .test-environment/pages
          if-no-files-found: error
  repositories:
    needs: [android, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;37.0.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-repository
          path: .test-environment/pages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-android
          path: .test-environment/android-release
      - run: sudo apt-get update && sudo apt-get install -y libzbar0
      - run: python3 -m venv .test-environment/fdroid-env && .test-environment/fdroid-env/bin/pip install -r scripts/requirements.txt
      - name: Create the signed F-Droid repository
        env:
          NEVUMI_FDROID_KEYSTORE_BASE64: ${{ secrets.MANIDA_FDROID_KEYSTORE_BASE64 }}
          NEVUMI_FDROID_KEYSTORE_PASSWORD: ${{ secrets.MANIDA_FDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          signing_directory=$(mktemp -d)
          trap 'rm -rf -- "$signing_directory"' EXIT
          printf '%s' "$NEVUMI_FDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_directory/nevumi-fdroid.jks"
          chmod 600 "$signing_directory/nevumi-fdroid.jks"
          export PATH="$GITHUB_WORKSPACE/.test-environment/fdroid-env/bin:$PATH"
          python scripts/package-fdroid.py --apk ".test-environment/android-release/nevumi-${GITHUB_REF_NAME#v}.apk" \
            --output .test-environment/pages/fdroid --keystore "$signing_directory/nevumi-fdroid.jks"
          python scripts/test-fdroid-repository.py
      # The Website workflow adds the landing page to these files, so it can deploy without a new release.
      - run: |
          mkdir -p .test-environment/repositories
          tar -czf .test-environment/repositories/nevumi-repositories.tar.gz -C .test-environment/pages .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-repositories
          path: .test-environment/repositories/nevumi-repositories.tar.gz
          if-no-files-found: error
  publish:
    needs: [android, linux, repositories]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd release
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Nevumi ${GITHUB_REF_NAME#v}" \
            --prerelease=false --generate-notes ./*.apk ./*.AppImage ./*.pkg.tar.zst \
            ./*.pkg.tar.zst.sig ./nevumi-repositories.tar.gz
  website:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/website.yml
