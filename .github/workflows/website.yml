name: Website
on:
  pull_request:
    paths:
      - website/**
      - packaging/nevumi.svg
      - packaging/fdroid-qr-*.png
      - packaging/screenshots/**
      - scripts/package-website.py
      - .github/workflows/website.yml
  push:
    branches: [master]
    paths:
      - website/**
      - packaging/nevumi.svg
      - packaging/fdroid-qr-*.png
      - packaging/screenshots/**
      - scripts/package-website.py
      - .github/workflows/website.yml
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --check website/script.js
      - name: Check website packaging
        run: python3 scripts/package-website.py --output "$RUNNER_TEMP/site" --signing-key 5948F17F1611CC2B995BC6121F0D542126D514AB
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    # Build and deploy in one job so a slower, older run cannot replace a newer deployment.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      # Releases call this from their tag, so always deploy the current landing page instead of the tagged one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      # GitHub Pages replaces the whole site on each deployment, so keep the newest release's repositories.
      - name: Download the release repositories
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir site
          # Development prereleases have no repositories, so pick the newest version tag.
          tag=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))) | .tag_name' \
            | awk 'NR == 1 { print }')
          if [[ -z "$tag" ]]; then
            echo '::warning::No version release exists yet, so the website deploys without the repositories'
            exit 0
          fi
          gh release download "$tag" --pattern nevumi-repositories.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/nevumi-repositories.tar.gz" -C site
          test -f site/arch/x86_64/nevumi.db && test -d site/fdroid/repo
      # Show the fingerprint of the key shipped with these repositories, which stays correct across key rotations.
      - run: |
          set -euo pipefail
          fingerprint="$NEVUMI_ARCH_SIGNING_FINGERPRINT"
          if [[ -f site/nevumi.asc ]]; then
            fingerprint=$(gpg --batch --show-keys --with-colons site/nevumi.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          fi
          python3 scripts/package-website.py --output site --signing-key "$fingerprint"
        env:
          NEVUMI_ARCH_SIGNING_FINGERPRINT: ${{ vars.MANIDA_ARCH_SIGNING_FINGERPRINT }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: pages
