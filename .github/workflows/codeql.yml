name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      analyze: ${{ steps.scope.outputs.analyze }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select languages affected by this change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          def languages_for(paths):
              languages = set()
              for path in paths:
                  suffix = Path(path).suffix
                  build = path.startswith('gradle/') or path.endswith(('.gradle', '.gradle.kts')) or path in {
                      'gradle.properties', 'gradlew', 'gradlew.bat'}
                  if build or suffix in {'.kt', '.kts', '.java', '.gradle'}:
                      languages.add('java-kotlin')
                  if build or path.startswith('native/') or suffix in {'.c', '.cpp', '.h', '.hpp', '.cmake'} or Path(path).name == 'CMakeLists.txt' or path in {
                      'scripts/build-visualizer.py', 'scripts/build-tailscale.py', 'scripts/build_mpv.py'}:
                      languages.add('c-cpp')
                  if suffix == '.go' or path.startswith('native/tailscale/') or path == 'scripts/build-tailscale.py':
                      languages.add('go')
                  if suffix == '.py' or path == 'scripts/requirements.txt':
                      languages.add('python')
                  if suffix in {'.js', '.mjs', '.cjs', '.jsx', '.ts', '.tsx'}:
                      languages.add('javascript-typescript')
                  if path.startswith('.github/workflows/'):
                      languages.add('actions')
                  if path.startswith('.github/codeql/'):
                      return all_languages
              return languages

          all_languages = {'java-kotlin', 'c-cpp', 'go', 'python', 'javascript-typescript', 'actions'}
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          if os.environ['EVENT_NAME'] == 'pull_request':
              base, head = event['pull_request']['base']['sha'], event['pull_request']['head']['sha']
              revisions = [f'{base}...{head}']
          elif os.environ['EVENT_NAME'] == 'push' and event.get('before', '').strip('0'):
              revisions = [event['before'], event['after']]
          else:
              revisions = []
          if revisions:
              paths = subprocess.check_output(['git', 'diff', '--name-only', '-z', '--no-renames', *revisions]).decode().split('\0')
              languages = languages_for(paths)
          else:
              languages = all_languages
          matrix = {'include': [{'language': language, 'build-mode': 'manual' if language in {'java-kotlin', 'c-cpp', 'go'} else 'none'}
                                for language in sorted(languages)]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix) + '\n')
              output.write('analyze=' + str(bool(languages)).lower() + '\n')
          PY
  analyze:
    needs: changes
    if: needs.changes.outputs.analyze == 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/tailscale/go.mod
          cache-dependency-path: native/tailscale/go.sum
      - if: matrix.build-mode == 'manual'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - if: matrix.build-mode == 'manual'
        run: bash scripts/sdkmanager-retry.sh 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - if: matrix.language == 'c-cpp'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsdl2-dev libgl1-mesa-dev
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Compile Android and desktop Kotlin
        if: matrix.language == 'java-kotlin'
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks -Pkotlin.compiler.execution.strategy=in-process :shared:compileKotlinDesktop :androidApp:compileDebugKotlin :desktopApp:compileKotlin --console=plain
      - name: Compile Linux and Android native code
        if: matrix.language == 'c-cpp'
        run: |
          python3 scripts/build-visualizer.py --output shared/build/native/runtime
          ./gradlew --no-daemon --no-build-cache --rerun-tasks :androidApp:externalNativeBuildDebug --console=plain
      - name: Compile the Tailscale client
        if: matrix.language == 'go'
        run: python3 scripts/build-tailscale.py --output shared/build/native/runtime
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
