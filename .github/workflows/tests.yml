name: Tests
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Filter paths here instead of in `on:` so the required Tests check always reports.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check whether this change affects the apps
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          from fnmatch import fnmatch
          import os
          import subprocess

          include = ['.github/workflows/tests.yml', '.github/actions/*', 'androidApp/*', 'desktopApp/*', 'shared/*',
                     'native/*', 'gradle/*', '*.gradle.kts', 'gradle.properties', 'gradlew', 'gradlew.bat', 'scripts/*',
                     'packaging/*', '.fdroid.yml']
          exclude = ['scripts/package-website.py', 'packaging/screenshots/*', 'packaging/fdroid-qr*.png']
          # Like `on: paths`, `*` matches `/`, but patterns without a `/` only match files at the root.
          def matches(path, patterns):
              return any(fnmatch(path, pattern) and ('/' in pattern or '/' not in path) for pattern in patterns)

          run = True
          if os.environ['EVENT_NAME'] == 'pull_request':
              paths = subprocess.check_output(['git', 'diff', '--name-only', '-z', '--no-renames',
                                               f"{os.environ['BASE']}...{os.environ['HEAD']}"]).decode().split('\0')
              run = any(matches(path, include) and not matches(path, exclude) for path in paths if path)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('run=' + str(run).lower() + '\n')
          PY
  android-shards:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Android suite driver
        run: python3 scripts/test-android-suite-runner.py
      - id: matrix
        name: Size shards from the current tests
        run: |
          shards="$(python3 scripts/test-android-suite.py --matrix)"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
  desktop:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/.test-environment/mpv-runtime/lib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/tailscale/go.mod
          cache-dependency-path: native/tailscale/go.sum
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg mpv libmpv-dev libsecret-tools gnome-keyring openssh-server xvfb xauth dbus cmake ninja-build libsdl2-dev libgl1-mesa-dev pulseaudio pulseaudio-utils meson pkg-config libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev libplacebo-dev libass-dev libpulse-dev libasound2-dev
      - run: python3 scripts/build_mpv.py --prefix .test-environment/mpv-runtime
      - run: dbus-run-session -- bash scripts/ci-tests.sh desktop
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-results
          path: |
            shared/build/test-results/desktopTest
            shared/hs_err_pid*.log
  android:
    needs: android-shards
    name: android (${{ matrix.device.api }}, shard ${{ matrix.shard.index }}/${{ matrix.shard.total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device:
          - api: 31
            # Pixel Launcher ANR dialogs in the Google image can cover the system picker.
            # The full AOSP image keeps launcher, picker, and graphics coverage.
            target: default
          - api: 36
            target: google_apis_ps16k
        shard: ${{ fromJSON(needs.android-shards.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: native/tailscale/go.mod
          cache-dependency-path: native/tailscale/go.sum
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - run: bash scripts/sdkmanager-retry.sh 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg mpv libsecret-tools openssh-server cmake ninja-build libsdl2-dev libgl1-mesa-dev pulseaudio-utils
      - name: Build test artifacts before starting the emulator
        run: >-
          ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx2g --max-workers=2
          -Pkotlin.compiler.execution.strategy=in-process
          :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest :shared:desktopTestClasses
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator action downloads these without retrying, so a corrupt archive would fail the job before tests run.
      - run: >-
          bash scripts/sdkmanager-retry.sh emulator platform-tools 'build-tools;37.0.0'
          'platforms;android-${{ matrix.device.api }}'
          'system-images;android-${{ matrix.device.api }};${{ matrix.device.target }};x86_64'
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        # Leave time for uploading reports if emulator boot, fixture setup, or teardown stalls.
        timeout-minutes: 20
        with:
          api-level: ${{ matrix.device.api }}
          target: ${{ matrix.device.target }}
          arch: x86_64
          disable-linux-hw-accel: false
          profile: pixel_2
          # API 36 can kill androidx.test.services under the device profile's default memory limit.
          ram-size: 4096M
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back virtualscene -camera-front emulated
          script: NEVUMI_ANDROID_SHARD=${{ matrix.shard.index }}/${{ matrix.shard.total }} bash scripts/ci-tests.sh android
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.device.api }}-shard-${{ matrix.shard.index }}-test-results
          path: |
            .test-environment/android-class-results
            .test-environment/pairing.log
            .test-environment/sftp.log
  tests:
    name: Tests
    needs: [changes, android-shards, desktop, android]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
