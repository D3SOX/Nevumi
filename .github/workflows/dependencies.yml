name: Dependency graph
on:
  push:
    branches: [master]
    paths:
      - '**/*.gradle.kts'
      - '**/*.gradle'
      - '**/gradle.lockfile'
      - gradle/**
      - gradle.properties
      - gradlew
      - gradlew.bat
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gradle:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0'
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
