name: Dependency graph
on:
  push:
    branches: [master]
    paths:
      - '**/*.gradle.kts'
      - '**/*.gradle'
      - '**/gradle.lockfile'
      - gradle/**
      - gradle.properties
      - gradlew
      - gradlew.bat
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gradle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
      - run: bash scripts/sdkmanager-retry.sh "$(grep '^platforms;' scripts/android-sdk-packages)"
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
