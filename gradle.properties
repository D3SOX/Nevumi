org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
appVersion=0.24.0
org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64
android.useAndroidX=true
kotlin.code.style=official
# Google's Maven repository sometimes stalls mid-download on CI runners, and Maven Central rate-limits them with 429s.
# Retry each request for about 4 minutes (8 tries, waits doubling from 2 s) before Gradle disables a repository.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
